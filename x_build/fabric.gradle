import java.nio.file.Files

return { Object project ->
    final boolean has_mappings = \
    (
          project.properties.minecraft.startsWith("0.") ||
          project.properties.minecraft.startsWith("1.")
    )

    if (has_mappings) {
        project.apply plugin: 'fabric-loom'
        project.ext.fabricLoaded = true
    } else {
        project.apply plugin: 'net.fabricmc.fabric-loom'
    }

    project.loom {}

    project.dependencies {
        minecraft "com.mojang:minecraft:${project.properties.minecraft}"

        if (has_mappings) {
            mappings project.loom.officialMojangMappings()
        }

        final var mod = obj -> has_mappings ? modImplementation(obj) : implementation(obj)

        mod "net.fabricmc:fabric-loader:${project.properties.fabric_loader}"
    }

    var classes1 = project.file("build/classes")
    var classes2 = project.file("build/the-classes")

    project.tasks.build.doFirst {
        if (classes1.exists()) {
            classes1.deleteDir()
        }

        if (classes2.exists()) {
            Files.move(classes2.toPath(), classes1)
        }
    }

    project.tasks.build.doLast {
        if (classes2.exists()) {
            classes2.deleteDir()
        }

        if (classes1.exists()) {
            Files.move(classes1.toPath(), classes2)
        }
    }

    project.tasks.runClient.dependsOn project.tasks.build

    if (project.ext.has("buildFile"))
        try             { Files.createSymbolicLink(project.file("run/mods/" + project.ext.buildFile.getFileName().toString() + ".jar").toPath(), project.ext.buildFile) }
        catch (ignored) {}
}
